apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS appdb;

    CREATE USER IF NOT EXISTS 'app_user'@'%' IDENTIFIED BY 'AppPass-MySQL-Lab-123!';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX ON appdb.* TO 'app_user'@'%';

    FLUSH PRIVILEGES;

    USE appdb;

    CREATE TABLE IF NOT EXISTS healthcheck (
      id INT AUTO_INCREMENT PRIMARY KEY,
      message VARCHAR(255),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO healthcheck(message) VALUES ('mysql standalone lab initialized');

